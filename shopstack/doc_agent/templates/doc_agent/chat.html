{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doc Agent</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
  #sidebar { width: 260px; border-right: 1px solid #ddd; padding: 12px; overflow-y: auto; }
  #sidebar h2 { font-size: 14px; margin: 0 0 8px; color: #555; }
  #sidebar ul { list-style: none; padding: 0; margin: 0; }
  #sidebar li { padding: 6px; cursor: pointer; border-radius: 4px; }
  #sidebar li:hover { background: #f3f3f3; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #thread { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 12px; max-width: 700px; }
  .msg.user { font-weight: 600; }
  .msg.assistant { background: #f9f9f9; padding: 10px; border-radius: 6px; }
  .citations { margin-top: 6px; font-size: 12px; color: #666; }
  .citation { display: inline-block; background: #eef; padding: 2px 6px; border-radius: 3px; margin-right: 6px; }
  #composer { border-top: 1px solid #ddd; padding: 12px; display: flex; gap: 8px; }
  #composer input { flex: 1; padding: 8px; font-size: 14px; }
  #composer button { padding: 8px 16px; }
</style>
</head>
<body>
  <aside id="sidebar">
    <h2>Conversations</h2>
    <ul id="conversation-list">
      {% for conv in conversations %}
        <li data-id="{{ conv.id }}">{{ conv.title|default:"Untitled" }}</li>
      {% endfor %}
    </ul>
  </aside>
  <section id="main">
    <div id="thread"></div>
    <form id="composer">
      <input id="question" type="text" placeholder="Ask the docs..." required>
      <button type="submit">Send</button>
    </form>
  </section>
<script>
  const csrftoken = document.cookie.split('; ')
    .find(r => r.startsWith('csrftoken='))?.split('=')[1] || '';
  let conversationId = null;
  const thread = document.getElementById('thread');

  function appendMsg(role, content, citations) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = content;
    if (citations && citations.length) {
      const cite = document.createElement('div');
      cite.className = 'citations';
      citations.forEach(c => {
        const chip = document.createElement('span');
        chip.className = 'citation';
        chip.textContent = c.source_path;
        cite.appendChild(chip);
      });
      el.appendChild(cite);
    }
    thread.appendChild(el);
    thread.scrollTop = thread.scrollHeight;
  }

  document.getElementById('composer').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('question');
    const question = input.value.trim();
    if (!question) return;
    appendMsg('user', question);
    input.value = '';
    const resp = await fetch('/api/agent/ask/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrftoken,
      },
      body: JSON.stringify({ question, conversation_id: conversationId }),
    });
    if (!resp.ok) {
      appendMsg('assistant', 'Error: ' + resp.status);
      return;
    }
    const data = await resp.json();
    conversationId = data.conversation_id;
    appendMsg('assistant', data.answer, data.citations);
  });

  document.querySelectorAll('#conversation-list li').forEach(li => {
    li.addEventListener('click', async () => {
      const id = li.dataset.id;
      const resp = await fetch('/api/agent/conversations/' + id + '/');
      if (!resp.ok) return;
      const data = await resp.json();
      conversationId = data.id;
      thread.innerHTML = '';
      data.messages.forEach(m => {
        appendMsg(m.role, m.content, m.cited_chunks);
      });
    });
  });
</script>
</body>
</html>
